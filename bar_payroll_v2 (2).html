<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Last Call Payroll</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500&display=swap');
  :root {
    --bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#2a2a2a;--border2:#333;
    --gold:#d4a843;--gold2:#f0c96a;--red:#c94a4a;--green:#4ac97a;--blue:#4a9fc9;
    --text:#e8e2d8;--muted:#888;--muted2:#555;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh;}
  .app{display:flex;flex-direction:column;min-height:100vh;}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.15em;color:var(--gold);}
  .logo span{color:var(--muted);font-size:13px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.05em;margin-left:12px;vertical-align:middle;}
  .mode-toggle{display:flex;background:var(--surface2);border-radius:6px;border:1px solid var(--border);overflow:hidden;}
  .mode-btn{padding:6px 14px;font-family:inherit;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all 0.15s;}
  .mode-btn.active{background:var(--gold);color:#000;font-weight:500;}
  .nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 24px;gap:4px;overflow-x:auto;}
  .nav-item{padding:12px 16px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;white-space:nowrap;}
  .nav-item.active{color:var(--gold);border-bottom-color:var(--gold);}
  .nav-item:hover:not(.active){color:var(--text);}
  .main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;}
  .card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .card-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.12em;color:var(--gold);}
  .card-body{padding:18px;}
  .btn{cursor:pointer;border:none;border-radius:5px;padding:8px 16px;font-family:inherit;font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;}
  .btn-gold{background:var(--gold);color:#000;}.btn-gold:hover{background:var(--gold2);}
  .btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold);}.btn-outline:hover{background:var(--gold);color:#000;}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid #3a2020;}.btn-danger:hover{background:#2a1010;}
  .btn-green{background:#1a3a26;color:var(--green);border:1px solid #1a4a2a;}.btn-green:hover{background:#1a4a2a;}
  .btn-sm{padding:5px 10px;font-size:10px;}
  .btn-icon{width:28px;height:28px;padding:0;justify-content:center;border-radius:4px;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  .form-label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);}
  .form-input,.form-select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:8px 12px;font-family:inherit;font-size:12px;outline:none;width:100%;transition:border 0.15s;}
  .form-input:focus,.form-select:focus{border-color:var(--gold);}
  textarea.form-input{resize:vertical;}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;}
  .form-row .form-group{flex:1;min-width:140px;}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;padding:8px 12px;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);font-weight:400;}
  td{padding:10px 12px;border-bottom:1px solid var(--border2);vertical-align:middle;font-size:12px;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface2);}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:500;}
  .badge-gold{background:#2a2010;color:var(--gold);border:1px solid #3a3010;}
  .badge-green{background:#102a18;color:var(--green);border:1px solid #103a18;}
  .badge-red{background:#2a1010;color:var(--red);border:1px solid #3a1010;}
  .badge-blue{background:#101a2a;color:var(--blue);border:1px solid #10203a;}
  .badge-gray{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
  .badge-chip{background:#1a1a1a;color:#e8e2d8;border:1px solid #3a3a3a;}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2a2010,#3a3020);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold);flex-shrink:0;border:1px solid var(--border);}
  .avatar-sm{width:24px;height:24px;font-size:11px;}
  .chip-token{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3a3a3a,#0a0a0a);border:2px solid #3a3a3a;box-shadow:0 0 8px #ffffff18,inset 0 1px 2px #ffffff22;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa;flex-shrink:0;}
  .chip-token-sm{width:22px;height:22px;font-size:8px;border-width:1px;}
  .chip-count-big{font-family:'Bebas Neue',sans-serif;font-size:42px;color:#e8e2d8;line-height:1;}
  .schedule-grid{display:grid;gap:2px;}
  .schedule-day{background:var(--surface2);border-radius:6px;border:1px solid var(--border);overflow:hidden;}
  .schedule-day-header{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .schedule-day-name{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:0.1em;color:var(--gold);}
  .schedule-slots{padding:8px;display:flex;flex-direction:column;gap:4px;min-height:60px;}
  .shift-chip-card{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:5px 8px;cursor:pointer;transition:all 0.15s;}
  .shift-chip-card:hover{border-color:var(--gold);}
  .add-shift-btn{border:1px dashed var(--border);border-radius:4px;padding:5px 8px;color:var(--muted2);font-size:11px;cursor:pointer;text-align:center;transition:all 0.15s;background:transparent;width:100%;font-family:inherit;}
  .add-shift-btn:hover{border-color:var(--gold);color:var(--gold);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
  .modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:0.1em;color:var(--gold);}
  .modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;}
  .modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--gold);border-radius:6px;padding:10px 16px;font-size:12px;color:var(--gold);z-index:999;animation:slideUp 0.2s ease;pointer-events:none;}
  @keyframes slideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .empty-state{text-align:center;padding:32px;color:var(--muted2);font-size:12px;}
  .info-box{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;font-size:12px;color:var(--muted);}
  .pending-banner{background:#2a2010;border:1px solid var(--gold);border-radius:8px;padding:14px 16px;margin-bottom:16px;}
  ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  input[type=number]::-webkit-inner-spin-button{opacity:0.5;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const ROLES=[
  {id:'kitchen',label:'Kitchen',color:'#e07a3a',till:true},
  {id:'open-bar',label:'Open Bartender',color:'#4a9fc9',till:true},
  {id:'closing-bar',label:'Closing Bartender',color:'#9a6ac9',till:true},
  {id:'server',label:'Cocktail Server',color:'#4ac97a',till:true},
  {id:'karaoke',label:'Karaoke',color:'#c94a8a',till:false},
  {id:'clerical',label:'Clerical/Admin',color:'#888',till:false},
  {id:'door',label:'Door',color:'#c9b44a',till:true},
  {id:'foh-meeting',label:'FOH Meeting',color:'#4ac9b4',till:false},
  {id:'boh-meeting',label:'BOH Meeting',color:'#c94a4a',till:false},
  {id:'unscheduled',label:'Unscheduled Shift',color:'#555',till:true},
];

let S={
  mode:'manager',activeNav:'schedule',currentUser:null,
  managerPin:'0000', managerPinSet:false, managerAuthed:false,
  employees:[
    {id:1,name:'Alex Rivera',role:'Closing Bartender',pin:'1234',bank:200,hasTill:true,chipsOwed:3,mustSetPin:false},
    {id:2,name:'Jordan Lee',role:'Cocktail Server',pin:'2222',bank:0,hasTill:false,chipsOwed:1,mustSetPin:false},
    {id:3,name:'Sam Okafor',role:'Open Bartender',pin:'3333',bank:150,hasTill:true,chipsOwed:0,mustSetPin:false},
    {id:4,name:'Casey Tran',role:'Karaoke',pin:'4444',bank:0,hasTill:false,chipsOwed:2,mustSetPin:false},
    {id:5,name:'Morgan Wells',role:'Kitchen',pin:'5555',bank:100,hasTill:true,chipsOwed:0,mustSetPin:false},
  ],
  weekStart:getMonday(new Date()),
  schedule:{},
  clockEntries:[],
  pendingVerifications:[],
  alerts:[],
  chipLog:[],
  tillCounts:[],  // {id,empId,type:'open'|'close',date,denoms,total,bank,posTotal,variance,bankConfirmed}
  modal:null,toast:null,toastTimer:null,
};
let ids={shift:100,entry:200,verify:300,alert:400,chip:500,till:600};
const DENOMS=[
  {key:'d100',label:'$100 Bills',value:100},
  {key:'d50', label:'$50 Bills', value:50},
  {key:'d20', label:'$20 Bills', value:20},
  {key:'d10', label:'$10 Bills', value:10},
  {key:'d5',  label:'$5 Bills',  value:5},
  {key:'d1',  label:'$1 Bills',  value:1},
  {key:'q',   label:'Quarters',  value:0.25},
  {key:'di',  label:'Dimes',     value:0.10},
  {key:'n',   label:'Nickels',   value:0.05},
  {key:'p',   label:'Pennies',   value:0.01},
];
function nid(k){return ids[k]++;}
function getMonday(d){const dt=new Date(d),day=dt.getDay(),diff=dt.getDate()-day+(day===0?-6:1);dt.setDate(diff);dt.setHours(0,0,0,0);return dt;}
function addDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt;}
function fmtDate(d){return d.toISOString().slice(0,10);}
function fmtDisp(s){return new Date(s+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function empById(id){return S.employees.find(e=>e.id===id);}
function roleColor(roleName){const r=ROLES.find(r=>r.label===roleName);return r?r.color:'#888';}
function initials(name){return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function showToast(msg){if(S.toastTimer)clearTimeout(S.toastTimer);S.toast=msg;S.toastTimer=setTimeout(()=>{S.toast=null;render();},2500);render();}
function closeModal(){S.modal=null;render();}

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  if(S.toast){const t=document.createElement('div');t.className='toast';t.textContent=S.toast;app.appendChild(t);}
  if(S.modal)app.appendChild(buildModal());
  const wrap=document.createElement('div');wrap.className='app';
  wrap.innerHTML=buildHeader();
  const nav=document.createElement('div');nav.className='nav';nav.innerHTML=buildNav();wrap.appendChild(nav);
  const main=document.createElement('div');main.className='main';
  if(S.mode==='manager'){
    if(S.activeNav==='schedule')main.appendChild(buildScheduleView());
    else if(S.activeNav==='staff')main.appendChild(buildStaffView());
    else if(S.activeNav==='chips')main.appendChild(buildChipsManagerView());
    else if(S.activeNav==='till')main.appendChild(buildTillManagerView());
    else if(S.activeNav==='alerts')main.appendChild(buildAlertsView());
  } else {
    main.appendChild(buildEmployeeView());
  }
  wrap.appendChild(main);
  app.appendChild(wrap);
  bindEvents();
}

function buildHeader(){
  const unread=S.alerts.filter(a=>!a.read).length;
  const emp=S.currentUser?empById(S.currentUser):null;
  return `<div class="header">
    <div style="display:flex;align-items:center;gap:16px">
      <div class="logo">Last Call <span>Payroll</span></div>
      ${emp?`<div style="display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 12px">
        <div class="avatar avatar-sm" style="color:${roleColor(emp.role)}">${initials(emp.name)}</div>
        <span style="font-size:12px">${emp.name}</span>
      </div>`:''}
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      ${unread>0?`<div style="background:#2a1010;border:1px solid var(--red);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--red);cursor:pointer" onclick="setNav('alerts')">⚠ ${unread} Alert${unread>1?'s':''}</div>`:''}
      ${S.managerAuthed?`<button class="btn btn-ghost btn-sm" onclick="openModal({type:'manager-change-pin'})">🔑 PIN</button><button class="btn btn-ghost btn-sm" onclick="openModal({type:'data-manage'})">💾 Data</button>`:''}
      <div class="mode-toggle">
        <button class="mode-btn ${S.mode==='manager'?'active':''}" onclick="setMode('manager')">Manager</button>
        <button class="mode-btn ${S.mode==='employee'?'active':''}" onclick="setMode('employee')">Employee${S.managerAuthed?' 🔒':''}</button>
      </div>
    </div>
  </div>`;
}

function buildNav(){
  const mgr=[['schedule','📅 Schedule'],['staff','👥 Staff'],['chips','⚫ Chips'],['till','💵 Till'],['alerts','🔔 Alerts']];
  const emp=[['emp-home','🏠 Home'],['emp-chips','⚫ My Chips'],['emp-tips','$ My Tips'],['emp-till','💵 My Till']];
  return (S.mode==='manager'?mgr:emp).map(([k,l])=>`<div class="nav-item ${S.activeNav===k?'active':''}" onclick="setNav('${k}')">${l}</div>`).join('');
}

function buildScheduleView(){
  const div=document.createElement('div');
  const days=Array.from({length:7},(_,i)=>fmtDate(addDays(S.weekStart,i)));
  div.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.1em;color:var(--gold)">Weekly Schedule</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtDisp(days[0])} – ${fmtDisp(days[6])}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="prevWeek()">← Prev</button>
        <button class="btn btn-ghost btn-sm" onclick="todayWeek()">Today</button>
        <button class="btn btn-ghost btn-sm" onclick="nextWeek()">Next →</button>
        <button class="btn btn-gold btn-sm" onclick="openModal({type:'add-shift',date:'${fmtDate(new Date())}'})">+ Add Shift</button>
      </div>
    </div>
    <div style="overflow-x:auto">
    <div class="schedule-grid" style="grid-template-columns:repeat(7,minmax(128px,1fr));min-width:700px">
      ${days.map(date=>{
        const shifts=S.schedule[date]||[],isToday=date===fmtDate(new Date());
        return `<div class="schedule-day" style="${isToday?'border-color:var(--gold)':''}">
          <div class="schedule-day-header">
            <div>
              <div class="schedule-day-name" style="${isToday?'color:var(--gold2)':''}">${new Date(date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'})}</div>
              <div style="font-size:11px;color:var(--muted)">${new Date(date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
            </div>
            ${isToday?'<span class="badge badge-gold" style="font-size:9px">Today</span>':''}
          </div>
          <div class="schedule-slots">
            ${shifts.map(s=>{const emp=empById(s.empId),rc=roleColor(s.role);return `
            <div class="shift-chip-card" onclick="openModal({type:'edit-shift',date:'${date}',shiftId:${s.id}})">
              <div class="avatar avatar-sm" style="color:${rc};background:${rc}18;border-color:${rc}30">${emp?initials(emp.name):'?'}</div>
              <div style="min-width:0;flex:1">
                <div style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${emp?emp.name.split(' ')[0]:'TBD'}</div>
                <div style="font-size:10px;color:${rc}">${s.role.replace(' Bartender',' Bar.')}</div>
              </div>
              <div style="font-size:10px;color:var(--muted2)">${s.startTime||''}</div>
            </div>`}).join('')}
            <button class="add-shift-btn" onclick="openModal({type:'add-shift',date:'${date}'})">+ shift</button>
          </div>
        </div>`;
      }).join('')}
    </div></div>
    <div style="margin-top:20px">
      <div class="card">
        <div class="card-header"><div class="card-title">Today's Roster</div><span style="font-size:11px;color:var(--muted)">${fmtDisp(fmtDate(new Date()))}</span></div>
        <div class="card-body">${buildTodayRoster()}</div>
      </div>
    </div>`;
  return div;
}

function buildTodayRoster(){
  const today=fmtDate(new Date()),shifts=S.schedule[today]||[];
  if(!shifts.length) return '<div class="empty-state">No shifts scheduled today.</div>';
  return '<div style="display:flex;flex-direction:column;gap:8px">'+shifts.map(s=>{
    const emp=empById(s.empId),rc=roleColor(s.role);
    const isIn=S.clockEntries.some(e=>e.empId===s.empId&&e.schedDate===today&&!e.clockOut);
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      <div class="avatar" style="color:${rc};background:${rc}15;border-color:${rc}30">${emp?initials(emp.name):'?'}</div>
      <div style="flex:1"><div style="font-size:13px">${emp?emp.name:'Unassigned'}</div>
      <div style="font-size:11px;color:${rc}">${s.role}${s.startTime?' · '+s.startTime:''}${s.endTime?' – '+s.endTime:''}</div></div>
      ${isIn?'<span class="badge badge-green">Clocked In</span>':'<span class="badge badge-gray">Not In</span>'}
      <button class="btn btn-ghost btn-sm" onclick="openModal({type:'edit-shift',date:'${today}',shiftId:${s.id}})">Edit</button>
    </div>`;
  }).join('')+'</div>';
}

function buildStaffView(){
  const div=document.createElement('div');
  div.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.1em;color:var(--gold)">Staff Roster</div>
      <button class="btn btn-gold btn-sm" onclick="openModal({type:'add-emp'})">+ Add Employee</button>
    </div>
    <div class="card">
      <div class="card-body" style="padding:0"><div class="table-wrap"><table>
        <thead><tr><th>Employee</th><th>Role</th><th>Till / Bank</th><th>Chips Owed</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${S.employees.map(emp=>{
          const isIn=S.clockEntries.some(e=>e.empId===emp.id&&!e.clockOut),rc=roleColor(emp.role);
          return `<tr>
            <td><div style="display:flex;align-items:center;gap:10px"><div class="avatar" style="color:${rc};background:${rc}15;border-color:${rc}30">${initials(emp.name)}</div>${emp.name}</div></td>
            <td><span style="color:${rc};font-size:11px">${emp.role}</span></td>
            <td>${emp.hasTill?`<span class="badge badge-gold">$${emp.bank} bank</span>`:'<span class="badge badge-gray">No Till</span>'}</td>
            <td><div style="display:flex;align-items:center;gap:6px">
              ${emp.chipsOwed>0?`${Array.from({length:Math.min(emp.chipsOwed,5)}).map(()=>'<div class="chip-token chip-token-sm">●</div>').join('')}${emp.chipsOwed>5?`<span style="font-size:11px;color:var(--muted)">+${emp.chipsOwed-5}</span>`:''} <span style="font-size:12px">${emp.chipsOwed}</span>`:'<span style="color:var(--muted2);font-size:11px">0</span>'}
            </div></td>
            <td>${isIn?'<span class="badge badge-green">On Clock</span>':emp.mustSetPin?'<span class="badge badge-gold">PIN Not Set</span>':'<span class="badge badge-gray">Off</span>'}</td>
            <td><div style="display:flex;gap:6px">
              <button class="btn btn-ghost btn-sm" onclick="openModal({type:'edit-emp',empId:${emp.id}})">Edit</button>

  if(canTipOut){
    html+=`<div class="card">
      <div class="card-header"><div class="card-title">Tip Out</div><button class="btn btn-gold btn-sm" onclick="openModal({type:'tip-out'})">Allocate Tips</button></div>
      <div class="card-body"><div style="font-size:12px;color:var(--muted2)">Allocate tip outs to other staff. They will verify receipt at their next login.</div></div>

  }
  if(emp.hasTill){
    const today=fmtDate(new Date());
    const todayOpen=S.tillCounts.find(t=>t.empId===S.currentUser&&t.type==='open'&&t.date===today);
    const todayClose=S.tillCounts.find(t=>t.empId===S.currentUser&&t.type==='close'&&t.date===today);
    html+=`<div class="card" style="margin-top:12px">

          ${todayClose?'✓ Close Count Done':'🔒 Close Till'}

  }
  div.innerHTML=html;
  return div;
}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${DENOMS.map(d=>`
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px">
          <div style="font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px">${d.label}</div>
          <div style="display:flex;align-items:center;gap:6px">
            <input class="form-input" type="number" min="0" step="1" placeholder="0" id="till-${d.key}" oninput="updateTillTotal()" style="padding:6px 8px;flex:1">
            <div style="font-size:11px;color:var(--muted2);white-space:nowrap">× $${d.value%1===0?d.value:d.value.toFixed(2)}</div>
          </div>
          <div style="font-size:11px;color:var(--gold);margin-top:4px" id="sub-${d.key}">$0.00</div>
        </div>`).join('')}
      </div>
      <div style="background:var(--surface);border:1px solid var(--gold);border-radius:8px;padding:14px;margin-top:4px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:12px;color:var(--muted)">Drawer Total</span>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold)" id="till-total">$0.00</span>
        </div>
        ${isClose?`
        <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:12px;color:var(--muted)">Leave Bank in Drawer</span>
            <span style="color:var(--gold)">$${emp?.bank?.toFixed(2)||'0.00'}</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <span style="font-size:12px;color:var(--muted)">Your Cash Sales (Total − Bank)</span>
            <span style="color:var(--blue);font-family:'Bebas Neue',sans-serif;font-size:20px" id="till-sales">$0.00</span>
          </div>
          <div class="form-group">
            <label class="form-label">POS Cash Sales Total</label>
            <input class="form-input" type="number" min="0" step="0.01" placeholder="Enter from Square/POS..." id="till-pos" oninput="updateTillVariance()">
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
            <span style="font-size:12px;color:var(--muted)">Variance (Your Count vs POS)</span>
            <span style="font-family:'Bebas Neue',sans-serif;font-size:20px" id="till-variance" style="color:var(--muted)">—</span>
          </div>
          <div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
            <label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer">
              <input type="checkbox" id="till-bank-confirm" style="width:auto">
              <span>I confirm that <strong style="color:var(--gold)">$${emp?.bank?.toFixed(2)||'0.00'}</strong> has been left in the drawer as the starting bank</span>
            </label>
          </div>
        </div>`:`
        <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:12px;color:var(--muted)">Expected Bank</span>
            <span style="color:var(--gold)">$${emp?.bank?.toFixed(2)||'0.00'}</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:12px;color:var(--muted)">Bank Variance</span>
            <span id="till-bank-var" style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted)">—</span>
          </div>
        </div>`}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="saveTillCount('${m.countType}',${m.empId})">Save Count</button>
    </div>`;
  }
  else if(m.type==='dispute'){
    const v=S.pendingVerifications.find(x=>x.id===m.verifyId);
    html=`<div class="modal-header"><div class="modal-title">Alert Manager</div><button class="btn btn-ghost btn-icon" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div style="background:#2a1010;border:1px solid var(--red);border-radius:6px;padding:12px;font-size:12px">Reporting missing tip out of <strong style="color:var(--gold)">$${v?.amount?.toFixed(2)}</strong> from ${empById(v?.fromEmpId)?.name||'?'}.</div>
      <div class="form-group"><label class="form-label">Message to Manager</label><textarea class="form-input" id="dis-msg" rows="3">${`I did not receive my tip out of $${v?.amount?.toFixed(2)} from ${empById(v?.fromEmpId)?.name}.`}</textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="sendDispute(${m.verifyId})">Send Alert</button></div>`;
  }

  overlay.innerHTML=`<div class="modal">${html}</div>`;
  return overlay;
}

// ─── ACTIONS ─────────────────────────────────────────────────
function doManagerLogin(){
  const pin=document.getElementById('mgr-pin')?.value;
  if(pin!==S.managerPin){showToast('Incorrect PIN');return;}
  S.managerAuthed=true;
  if(!S.managerPinSet){
    S.modal={type:'manager-set-pin'};render();return;
  }
  S.modal=null;S.mode='manager';S.activeNav='schedule';render();
}
function doSetManagerPin(){
  const p1=document.getElementById('mgr-new1')?.value;
  const p2=document.getElementById('mgr-new2')?.value;
  if(!p1||p1.length<4){alert('PIN must be 4 digits');return;}
  if(p1!==p2){alert('PINs do not match');return;}
  S.managerPin=p1;S.managerPinSet=true;
  S.modal=null;S.mode='manager';S.activeNav='schedule';
  showToast('Manager PIN set!');
}
function doChangeManagerPin(){
  const cur=document.getElementById('mcp-cur')?.value;
  const p1=document.getElementById('mcp-new1')?.value;
  const p2=document.getElementById('mcp-new2')?.value;
  if(cur!==S.managerPin){alert('Current PIN incorrect');return;}
  if(!p1||p1.length<4){alert('PIN must be 4 digits');return;}
  if(p1!==p2){alert('PINs do not match');return;}
  S.managerPin=p1;closeModal();showToast('Manager PIN updated!');
}
function doSetEmpPin(empId){
  const p1=document.getElementById('emp-new1')?.value;
  const p2=document.getElementById('emp-new2')?.value;
  if(!p1||p1.length<4){alert('PIN must be 4 digits');return;}
  if(p1!==p2){alert('PINs do not match');return;}
  const i=S.employees.findIndex(e=>e.id===empId);
  if(i>=0){S.employees[i].pin=p1;S.employees[i].mustSetPin=false;}
  S.currentUser=empId;S.activeNav='emp-home';
  closeModal();showToast('PIN set! Welcome.');
}
function doChangeEmpPin(empId){
  const p1=document.getElementById('cp-new1')?.value;
  const p2=document.getElementById('cp-new2')?.value;
  if(!p1||p1.length<4){alert('PIN must be 4 digits');return;}
  if(p1!==p2){alert('PINs do not match');return;}
  const i=S.employees.findIndex(e=>e.id===empId);
  if(i>=0){S.employees[i].pin=p1;S.employees[i].mustSetPin=true;}
  closeModal();showToast('Employee PIN updated. They will set a new PIN on next login.');
}
function doManagerLogout(){S.managerAuthed=false;S.mode='employee';S.currentUser=null;S.activeNav='emp-home';render();}
function setMode(m){
  if(m==='manager'){
    if(!S.managerAuthed){S.modal={type:'manager-login'};render();return;}
    S.mode='manager';S.activeNav='schedule';render();
  } else {
    if(S.managerAuthed){doManagerLogout();}
    else{S.mode='employee';S.currentUser=null;S.activeNav='emp-home';render();}
  }
}
function setNav(n){S.activeNav=n;render();}
function openModal(obj){S.modal=obj;render();}
function prevWeek(){S.weekStart=addDays(S.weekStart,-7);render();}
function nextWeek(){S.weekStart=addDays(S.weekStart,7);render();}
function todayWeek(){S.weekStart=getMonday(new Date());render();}

function saveShift(){
  const date=document.getElementById('s-date').value;
  const empId=parseInt(document.getElementById('s-emp').value)||null;
  const role=document.getElementById('s-role').value;
  const startTime=document.getElementById('s-start').value;
  const endTime=document.getElementById('s-end').value;
  if(!date||!role)return;
  if(!S.schedule[date])S.schedule[date]=[];
  if(S.modal.type==='edit-shift'){
    const i=S.schedule[date].findIndex(s=>s.id===S.modal.shiftId);
    if(i>=0)S.schedule[date][i]={...S.schedule[date][i],empId,role,startTime,endTime};
  } else {
    S.schedule[date].push({id:nid('shift'),empId,role,startTime,endTime});
  }
  closeModal();showToast('Shift saved!');
}
function deleteShift(date,shiftId){S.schedule[date]=(S.schedule[date]||[]).filter(s=>s.id!==shiftId);closeModal();showToast('Shift removed.');}
function saveEmployee(){
  const name=document.getElementById('e-name').value.trim();
  const role=document.getElementById('e-role').value;
  const pin=document.getElementById('e-pin').value;
  const hasTill=document.getElementById('e-hastill').checked;
  const bank=parseFloat(document.getElementById('e-bank').value)||0;
  if(!name)return;
  if(S.modal.type==='edit-emp'){
    const i=S.employees.findIndex(e=>e.id===S.modal.empId);
    if(i>=0)S.employees[i]={...S.employees[i],name,role,pin,hasTill,bank};
  } else {
    S.employees.push({id:Date.now(),name,role,pin,hasTill,bank,chipsOwed:0,mustSetPin:true});
  }
  closeModal();showToast('Saved!');
}
function removeEmp(id){if(!confirm('Remove employee?'))return;S.employees=S.employees.filter(e=>e.id!==id);render();}
function saveBank(empId){
  const hasTill=document.getElementById('bk-hastill').checked;
  const bank=parseFloat(document.getElementById('bk-amount').value)||0;
  const i=S.employees.findIndex(e=>e.id===empId);
  if(i>=0)S.employees[i]={...S.employees[i],hasTill,bank};
  closeModal();showToast('Bank updated!');
}
function quickChip(empId,delta){
  const i=S.employees.findIndex(e=>e.id===empId);if(i<0)return;
  const prev=S.employees[i].chipsOwed,next=Math.max(0,prev+delta);
  S.employees[i].chipsOwed=next;
  S.chipLog.push({id:nid('chip'),empId,date:fmtDate(new Date()),type:'adjustment',qty:next-prev,note:'Manager quick adjust'});
  saveState();render();
}
function saveChipAdjust(empId){
  const newCount=parseInt(document.getElementById('ca-count').value)||0;
  const note=document.getElementById('ca-note').value.trim()||'Manager adjustment';
  const i=S.employees.findIndex(e=>e.id===empId);if(i<0)return;
  const diff=newCount-S.employees[i].chipsOwed;
  S.employees[i].chipsOwed=newCount;
  S.chipLog.push({id:nid('chip'),empId,date:fmtDate(new Date()),type:'adjustment',qty:diff,note});
  closeModal();showToast('Chip balance updated!');
}
function loginEmployee(id){
  const emp=empById(id);
  if(emp?.mustSetPin){S.modal={type:'emp-set-pin',empId:id};render();return;}
  S.currentUser=id;S.activeNav='emp-home';render();
}
function logoutEmployee(){S.currentUser=null;S.activeNav='emp-home';render();}

let _chipChoice=null;
function setChipChoice(val){
  _chipChoice=val;
  const msg=document.getElementById('chip-msg');
  const yb=document.getElementById('chip-yes-btn');
  const nb=document.getElementById('chip-no-btn');
  if(msg)msg.textContent=val?'Chip collected — no change to your balance':'Chip will be added to your owed balance (+1)';
  if(yb)yb.style.borderColor=val?'var(--green)':'var(--border)';
  if(nb)nb.style.borderColor=!val?'var(--red)':'var(--border)';
}
function doClockIn(){
  const pin=document.getElementById('ci-pin')?.value;
  const emp=empById(S.currentUser);
  if(pin!==emp?.pin){alert('Incorrect PIN');return;}
  const shiftEl=document.getElementById('ci-shift');
  const shiftId=shiftEl?parseInt(shiftEl.value)||null:null;
  const today=fmtDate(new Date());
  S.clockEntries.push({id:nid('entry'),empId:S.currentUser,shiftId,schedDate:today,clockIn:Date.now(),clockOut:null,tipsCash:0,tipsCC:0,notes:'',tipOuts:[],chipCollected:null});
  closeModal();showToast('Clocked in!');
}
function doClockOut(){
  if(_chipChoice===null){alert('Please select whether you collected your chip.');return;}
  const tipsCash=parseFloat(document.getElementById('co-cash')?.value)||0;
  const tipsCC=parseFloat(document.getElementById('co-cc')?.value)||0;
  const notes=document.getElementById('co-notes')?.value||'';
  const i=S.clockEntries.findIndex(e=>e.empId===S.currentUser&&!e.clockOut);
  if(i>=0){Object.assign(S.clockEntries[i],{clockOut:Date.now(),tipsCash,tipsCC,notes,chipCollected:_chipChoice});}
  const ei=S.employees.findIndex(e=>e.id===S.currentUser);
  const today=fmtDate(new Date());
  if(_chipChoice){
    S.chipLog.push({id:nid('chip'),empId:S.currentUser,date:today,type:'collected',qty:0,note:'Collected at end of shift'});
  } else {
    S.employees[ei].chipsOwed+=1;
    S.chipLog.push({id:nid('chip'),empId:S.currentUser,date:today,type:'earned',qty:1,note:'Chip not collected — added to balance'});
  }
  _chipChoice=null;
  closeModal();showToast('Clocked out! Tips & chip recorded.');
}
function saveTipOut(){
  const others=S.employees.filter(e=>e.id!==S.currentUser);
  const today=fmtDate(new Date());let count=0;
  others.forEach(e=>{
    const amt=parseFloat(document.getElementById(`to-${e.id}`)?.value)||0;
    if(amt>0){S.pendingVerifications.push({id:nid('verify'),fromEmpId:S.currentUser,toEmpId:e.id,amount:amt,date:today,status:'pending'});count++;}
  });
  closeModal();showToast(`Tip out sent to ${count} employee${count!==1?'s':''}!`);
}
function verifyTip(id){const i=S.pendingVerifications.findIndex(v=>v.id===id);if(i>=0)S.pendingVerifications[i].status='verified';saveState();showToast('Tip verified!');}
function delayTip(id){const i=S.pendingVerifications.findIndex(v=>v.id===id);if(i>=0)S.pendingVerifications[i].status='delayed';saveState();showToast('Reminder delayed until next login.');}
function sendDispute(verifyId){
  const msg=document.getElementById('dis-msg').value.trim();
  const i=S.pendingVerifications.findIndex(v=>v.id===verifyId);
  if(i>=0)S.pendingVerifications[i].status='disputed';
  S.alerts.push({id:nid('alert'),empId:S.currentUser,message:msg,date:fmtDate(new Date()),read:false});
  closeModal();showToast('Alert sent to manager!');
}
function dismissAlert(id){const i=S.alerts.findIndex(a=>a.id===id);if(i>=0)S.alerts[i].read=true;render();}
function markAllRead(){S.alerts.forEach(a=>a.read=true);render();}
function updateTillTotal(){
  let total=0;
  const denoms={};
  DENOMS.forEach(d=>{
    const qty=parseInt(document.getElementById('till-'+d.key)?.value)||0;
    const sub=qty*d.value;
    denoms[d.key]=qty;
    total+=sub;
    const subEl=document.getElementById('sub-'+d.key);
    if(subEl)subEl.textContent='$'+sub.toFixed(2);
  });
  const totalEl=document.getElementById('till-total');
  if(totalEl)totalEl.textContent='$'+total.toFixed(2);
  const emp=empById(S.modal?.empId);
  const bank=emp?.bank||0;
  const salesEl=document.getElementById('till-sales');
  if(salesEl)salesEl.textContent='$'+(Math.max(0,total-bank)).toFixed(2);
  const bvEl=document.getElementById('till-bank-var');
  if(bvEl){const bv=total-bank;bvEl.textContent=(bv>0?'+':'')+'$'+bv.toFixed(2);bvEl.style.color=Math.abs(bv)<0.01?'var(--green)':bv<0?'var(--red)':'var(--gold)';}
  updateTillVariance();
}
function updateTillVariance(){
  const emp=empById(S.modal?.empId);
  const bank=emp?.bank||0;
  let total=0;
  DENOMS.forEach(d=>{const qty=parseInt(document.getElementById('till-'+d.key)?.value)||0;total+=qty*d.value;});
  const cashSales=total-bank;
  const posVal=parseFloat(document.getElementById('till-pos')?.value);
  const vEl=document.getElementById('till-variance');
  if(vEl&&!isNaN(posVal)){
    const v=cashSales-posVal;
    vEl.textContent=(v>0?'+':'')+'$'+v.toFixed(2);
    vEl.style.color=Math.abs(v)<0.01?'var(--green)':v<0?'var(--red)':'var(--gold)';
  }
}
function saveTillCount(countType,empId){
  const emp=empById(empId);
  if(!emp)return;
  const bank=emp.bank||0;
  let total=0;
  const denoms={};
  DENOMS.forEach(d=>{const qty=parseInt(document.getElementById('till-'+d.key)?.value)||0;denoms[d.key]=qty;total+=qty*d.value;});
  const today=fmtDate(new Date());
  if(countType==='close'){
    const confirmed=document.getElementById('till-bank-confirm')?.checked;
    if(!confirmed){alert('Please confirm that the starting bank has been left in the drawer.');return;}
    const posTotal=parseFloat(document.getElementById('till-pos')?.value)||null;
    const cashSales=total-bank;
    const variance=posTotal!=null?cashSales-posTotal:0;
    S.tillCounts.push({id:nid('till'),empId,type:'close',date:today,denoms,total,bank,posTotal,cashSales,variance,bankConfirmed:true});
    // Flag to manager if significant variance
    if(posTotal!=null&&Math.abs(variance)>1){
      S.alerts.push({id:nid('alert'),empId,message:`Till variance of ${variance>0?'+':''}$${variance.toFixed(2)} on closing count for ${emp.name}. Cash sales counted: $${cashSales.toFixed(2)}, POS reported: $${posTotal.toFixed(2)}.`,date:today,read:false});
    }
  } else {
    const bankVariance=total-bank;
    S.tillCounts.push({id:nid('till'),empId,type:'open',date:today,denoms,total,bank,posTotal:null,cashSales:null,variance:bankVariance,bankConfirmed:false});
    if(Math.abs(bankVariance)>0.01){
      S.alerts.push({id:nid('alert'),empId,message:`Opening count discrepancy for ${emp.name}. Expected bank: $${bank.toFixed(2)}, Actual count: $${total.toFixed(2)}, Difference: ${bankVariance>0?'+':''}$${bankVariance.toFixed(2)}.`,date:today,read:false});
    }
  }
  closeModal();showToast(`${countType==='open'?'Opening':'Closing'} count saved!`);
}
function bindEvents(){
  const tc=document.getElementById('e-hastill');
  if(tc)tc.addEventListener('change',()=>{const bg=document.getElementById('bank-grp');if(bg)bg.style.opacity=tc.checked?'1':'0.4';});
}

// ─── LOCALSTORAGE PERSISTENCE ────────────────────────────────
const STORAGE_KEY='lastcall_payroll_v2';

function confirmClearData(){
  if(!confirm('Are you absolutely sure? This will erase ALL employees, schedules, clock entries, tips, chips, and till data. This cannot be undone.')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}
function saveState(){
  try{
    const persisted={
      managerPin:S.managerPin,
      managerPinSet:S.managerPinSet,
      employees:S.employees,
      schedule:S.schedule,
      clockEntries:S.clockEntries,
      pendingVerifications:S.pendingVerifications,
      alerts:S.alerts,
      chipLog:S.chipLog,
      tillCounts:S.tillCounts,
      ids:ids,
    };
    localStorage.setItem(STORAGE_KEY,JSON.stringify(persisted));
  }catch(e){console.warn('Save failed:',e);}
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved=JSON.parse(raw);
    if(saved.managerPin) S.managerPin=saved.managerPin;
    if(saved.managerPinSet!=null) S.managerPinSet=saved.managerPinSet;
    if(saved.employees?.length) S.employees=saved.employees;
    if(saved.schedule) S.schedule=saved.schedule;
    if(saved.clockEntries) S.clockEntries=saved.clockEntries;
    if(saved.pendingVerifications) S.pendingVerifications=saved.pendingVerifications;
    if(saved.alerts) S.alerts=saved.alerts;
    if(saved.chipLog) S.chipLog=saved.chipLog;
    if(saved.tillCounts) S.tillCounts=saved.tillCounts;
    if(saved.ids) ids=saved.ids;
    return true;
  }catch(e){console.warn('Load failed:',e);return false;}
}

// Wrap showToast and closeModal to auto-save on any state change
const _origShowToast=showToast;
showToast=function(msg){saveState();_origShowToast(msg);};
const _origCloseModal=closeModal;
closeModal=function(){saveState();_origCloseModal();};

      {id:nid('shift'),empId:4,role:'Karaoke',startTime:'20:00',endTime:'02:00'},
      {id:nid('shift'),empId:5,role:'Kitchen',startTime:'15:00',endTime:'23:00'},

    S.schedule[tom]=[

      {id:nid('shift'),empId:2,role:'Open Bartender',startTime:'10:00',endTime:'17:00'},
    ];
    S.schedule[yest]=[
      {id:nid('shift'),empId:1,role:'Closing Bartender',startTime:'17:00',endTime:'02:00'},
      {id:nid('shift'),empId:5,role:'Kitchen',startTime:'15:00',endTime:'23:00'},
    ];
    S.pendingVerifications.push({id:nid('verify'),fromEmpId:1,toEmpId:2,amount:18.50,date:yest,status:'pending'});
    S.chipLog.push({id:nid('chip'),empId:1,date:yest,type:'earned',qty:1,note:'Chip not collected'});
    S.chipLog.push({id:nid('chip'),empId:2,date:yest,type:'earned',qty:1,note:'Chip not collected'});
    S.chipLog.push({id:nid('chip'),empId:4,date:yest,type:'earned',qty:2,note:'Chips not collected'});
    saveState();
  }
})();

render();
